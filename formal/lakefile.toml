name = "threshold-lean-xmss-security"
version = "0.1.0"
defaultTargets = ["ThresholdLeanXmss", "ThresholdLeanXmssSecurity"]

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "f1e63c780de398fb62206dd5890f27e1ad64e0e6"

[[require]]
name = "lean-xmss-security"
git = "https://github.com/leanEthereum/leanVM.git"
rev = "fdb317982286422300def1519931e090a5a3d32b"
subDir = "formal/lean_xmss"

[[lean_lib]]
name = "ThresholdLeanXmss"

# The library has the modules that its root `ThresholdLeanXmssSecurity.lean` imports. The files of
# `Proof/DkgSecurity/` that the root does not import are on the game without the vote.
[[lean_lib]]
name = "ThresholdLeanXmssSecurity"
# This linter computes the normal form of the type of each bound variable. It gives no warning in the
# proofs and costs up to half of the build time of a large module. The editor still runs it.
weakLeanArgs = ["-Dlinter.constructorNameAsVariable=false"]
